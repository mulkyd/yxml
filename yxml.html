<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F8FA">
    <title>游戏目录</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-indigo: #5856D6;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-red: #FF3B30;
            --gray0: #FFFFFF;
            --gray1: #F7F8FA;
            --gray2: #E5E5EA;
            --gray3: #D1D1D6;
            --gray4: #86868B;
            --gray5: #6E6E73;
            --gray6: #3A3A3C;
            --text-main: #111;
            --text-sub: #6E6E73;
            --text-meta: #86868B;
            --r-xs: 6px;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-full: 9999px;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-s: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-m: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-popup: 0 10px 30px rgba(0,0,0,0.22);
            --ease: cubic-bezier(0.2,0,0.2,1);
            --trans: all 0.24s var(--ease);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", system-ui, sans-serif;
            background: var(--gray1);
            overscroll-behavior: none;
            font-size: 16px;
        }

        body {
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            line-height: 1.45;
            position: relative;
        }

        input[type="text"] {
            -webkit-user-select: text;
            user-select: text;
        }

        .top-section {
            padding: max(18px, env(safe-area-inset-top)) 16px 12px;
            background:
                url("游戏目录.jpg") center/cover no-repeat,
                linear-gradient(to bottom, rgba(255,255,255,0.96), rgba(255,255,255,0.88));
            background-blend-mode: lighten;
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid rgba(209,209,214,0.5);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 6px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111;
        }

        .update-date-text {
            text-align: center;
            font-size: 13px;
            color: var(--ios-orange);
            font-weight: 600;
            margin-bottom: 10px;
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--r-full);
            background: rgba(255,149,0,0.08);
        }

        .search-wrap{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
        }
        .search-label{
            font-size:17px;
            font-weight:700;
            color:#222;
            white-space:nowrap;
        }
        .search-box {
            flex:1;
            height: 46px;
            min-height: 46px;
            padding: 0 16px;
            border: none;
            outline: none;
            border-radius: var(--r-md);
            background: rgba(255,255,255,0.96);
            box-shadow: var(--shadow-xs);
            transition: var(--trans);
            font-size: 16px;
            color: var(--text-main);
        }

        .search-box::placeholder {
            color: var(--gray4);
        }

        .search-box:focus {
            box-shadow: 0 0 0 4px rgba(0,122,255,0.12), var(--shadow-s);
            transform: scale(1.01);
        }

        .category-trigger-wrap{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .cat-label{
            font-size:17px;
            font-weight:700;
            color:#222;
            white-space:nowrap;
        }
        .category-trigger {
            flex:1;
            height: 42px;
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(209,209,214,0.6);
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--trans);
        }
        .category-trigger-content{
            display:flex;
            align-items:center;
            flex:1;
            gap:12px;
        }
        .category-trigger-text{
            font-size: 13px;
            font-weight: 600;
            color:#111;
            white-space: nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width: 180px;
        }
        .category-trigger-text.searching{
            color: var(--gray4);
        }
        .category-trigger-hint{
            font-size:12px;
            color:var(--gray4);
            white-space:nowrap;
            margin-left:auto;
        }

        .category-trigger:active {
            transform: scale(0.97);
            background: var(--gray2);
        }

        .category-trigger .arrow {
            transition: transform 0.22s var(--ease);
            color: var(--gray4);
            font-size: 12px;
            margin-left:8px;
        }

        .category-trigger.open .arrow {
            transform: rotate(180deg);
        }

        .category-popup-wrap {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.38);
            display: none;
            padding-top: calc(env(safe-area-inset-top) + 120px);
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 20px;
            animation: fadeIn 0.2s var(--ease);
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .category-popup {
            background: var(--gray0);
            border-radius: var(--r-lg);
            padding: 16px;
            box-shadow: var(--shadow-popup);
            animation: slideUp 0.24s var(--ease);
        }

        @keyframes slideUp {
            from {
                transform: translateY(10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .category-popup-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            gap: 8px 10px;
        }

        .category-item {
            padding: 7px 6px;
            min-height: 34px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(209,209,214,0.6);
            border-radius: var(--r-full);
            background: var(--gray1);
            color: var(--text-main);
            transition: 0.18s var(--ease);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .category-item.active {
            background: var(--ios-blue);
            color: #fff;
            border-color: var(--ios-blue);
            font-weight:550;
            box-shadow: 0 0 0 4px rgba(0,122,255,0.14);
        }

        .category-item:active {
            transform: scale(0.94);
        }

        .game-scroll-wrap {
            flex: 1;
            overflow: hidden;
            position:relative;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px max(16px, env(safe-area-inset-bottom));
            background: var(--gray1);
            cursor: grab;
        }
        .game-scroll-wrap:active{
            cursor:grabbing;
        }

        .scroll-inner{
            will-change: transform;
        }

        .virtual-wrap {
            position: relative;
        }

        .virtual-phantom {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            z-index: -1;
        }

        .virtual-view {
            position: relative;
        }

        .game-item {
            padding: 14px 16px;
            margin: 6px 0;
            font-size: 16px;
            font-weight:500;
            background: rgba(255,255,255,0.92);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-xs);
            transition: 0.18s var(--ease);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 12px;
        }

        .game-name {
            flex: 1 1 auto;
            min-width: 0;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .platform-tags {
            flex: 0 0 auto;
            min-width: 0;
            max-width: 48%;
            font-size: 12px;
            color: var(--text-meta);
            line-height: 1.45;
            text-align: right;
            word-break: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-item:active {
            background: rgba(0,0,0,0.04);
            transform: scale(0.985);
            box-shadow: none;
        }

        .empty-tip {
            padding: 100px 0;
            text-align: center;
            font-size: 15px;
            color: var(--gray4);
            line-height: 1.6;
        }

        .empty-tip strong {
            color: var(--ios-red);
            font-weight: 500;
        }

        .bottom-tip {
            margin-top: 16px;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            color: var(--gray4);
            opacity: 0;
            visibility: hidden;
            transition: var(--trans);
        }

        .bottom-tip.show {
            opacity: 1;
            visibility: visible;
        }

        @media screen and (min-width: 768px) {
            body {
                max-width: 720px;
                margin: 0 auto;
                box-shadow: 0 0 40px rgba(0,0,0,0.08);
                background: #fff;
            }
            html {
                background: var(--gray2);
            }
            .category-list {
                grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
            }
        }

        @media screen and (max-width: 360px) {
            .top-section {
                padding: max(16px, env(safe-area-inset-top)) 12px 10px;
            }
            .page-title {
                font-size: 20px;
            }
            .search-wrap{
                gap:6px;
            }
            .category-trigger-wrap{
                gap:6px;
            }
            .search-label{
                font-size:16px;
            }
            .cat-label{
                font-size:16px;
            }
            .search-box {
                height: 44px;
                font-size: 15px;
            }
            .category-trigger {
                height: 40px;
                font-size: 12px;
            }
            .category-trigger-hint{
                font-size:11px;
            }
            .category-list {
                grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
                gap: 7px 8px;
            }
            .category-item {
                font-size: 12px;
                min-height: 32px;
                padding: 6px 4px;
            }
            .game-item {
                padding: 12px 14px;
                margin: 4px 0;
            }
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="nav-bar">
            <h1 class="page-title">游戏目录</h1>
        </div>

        <div style="text-align:center;">
            <div class="update-date-text">目录更新日期：2026-10-07</div>
        </div>

        <div class="search-wrap">
            <span class="search-label">搜索</span>
            <input type="text" class="search-box" id="search" placeholder="搜索游戏名称">
        </div>

        <div class="category-trigger-wrap">
            <span class="cat-label">游戏平台</span>
            <div class="category-trigger" id="catTrigger">
                <div class="category-trigger-content">
                    <span class="category-trigger-text" id="currentCatText">全部游戏</span>
                    <span class="category-trigger-hint" id="catHint">点击切换游戏平台</span>
                </div>
                <span class="arrow">▼</span>
            </div>
        </div>
    </div>

    <div class="category-popup-wrap" id="catPopup">
        <div class="category-popup">
            <div class="category-popup-title">选择游戏平台</div>
            <div class="category-list" id="categoryBox">
            </div>
        </div>
    </div>

    <div class="game-scroll-wrap" id="gameDragBox">
        <div class="scroll-inner" id="scrollInner">
            <div class="virtual-wrap" id="virtualWrap">
                <div class="virtual-phantom" id="phantom"></div>
                <div class="virtual-view" id="virtualView"></div>
            </div>
        </div>
        <div class="bottom-tip" id="bottomTip">已经到最底了</div>
    </div>

    <script>
        const $ = {
            catTrigger: document.getElementById('catTrigger'),
            catPopup: document.getElementById('catPopup'),
            currentCatText: document.getElementById('currentCatText'),
            catHint: document.getElementById('catHint'),
            categoryBox: document.getElementById('categoryBox'),
            gameDragBox: document.getElementById('gameDragBox'),
            scrollInner: document.getElementById('scrollInner'),
            bottomTip: document.getElementById('bottomTip'),
            search: document.getElementById('search'),
            virtualWrap: document.getElementById('virtualWrap'),
            phantom: document.getElementById('phantom'),
            virtualView: document.getElementById('virtualView')
        };

        const VIRTUAL_ITEM_HEIGHT = 56;
        const VIRTUAL_BUFFER = 10;
        let virtualListData = [];
        let lastSelectCatText = "全部游戏";

        let drag = {
            isDown:false,
            startY:0,
            offsetY:0,
            velocity:0,
            lastY:0,
            lastTime:0,
            maxOffset:0,
            minOffset:0
        };
        let inertiaAnim = null;
        let isFingerDragging = false;

        function setOffsetOnlyTransform(y){
            const h = $.gameDragBox.clientHeight;
            const contentH = virtualListData.length * VIRTUAL_ITEM_HEIGHT;
            drag.minOffset = Math.min(0, h - contentH);
            drag.maxOffset = 0;
            if(y>drag.maxOffset) y = drag.maxOffset;
            if(y<drag.minOffset) y = drag.minOffset;
            drag.offsetY = y;
            $.scrollInner.style.transform = `translateY(${drag.offsetY}px)`;
        }

        function fullSetOffset(y){
            setOffsetOnlyTransform(y);
            const fakeScroll = -drag.offsetY;
            const st = fakeScroll;
            const h = $.gameDragBox.clientHeight;
            const contentH = virtualListData.length * VIRTUAL_ITEM_HEIGHT;
            $.bottomTip.classList.toggle('show', st + h >= contentH - 8);
            renderVirtualListByScroll(st);
        }

        function startInertia(){
            if(inertiaAnim) cancelAnimationFrame(inertiaAnim);
            const dec = 0.94;
            const minV = 3;
            function step(){
                drag.velocity *= dec;
                setOffsetOnlyTransform(drag.offsetY + drag.velocity);
                const fakeScroll = -drag.offsetY;
                const h = $.gameDragBox.clientHeight;
                const contentH = virtualListData.length * VIRTUAL_ITEM_HEIGHT;
                $.bottomTip.classList.toggle('show', fakeScroll + h >= contentH - 8);
                renderVirtualListByScroll(fakeScroll);
                if(Math.abs(drag.velocity) < minV){
                    drag.velocity = 0;
                    return;
                }
                inertiaAnim = requestAnimationFrame(step);
            }
            inertiaAnim = requestAnimationFrame(step);
        }

        $.gameDragBox.addEventListener('mousedown',(e)=>{
            if(inertiaAnim) cancelAnimationFrame(inertiaAnim);
            drag.isDown = true;
            isFingerDragging = true;
            drag.startY = e.clientY;
            drag.lastY = e.clientY;
            drag.lastTime = performance.now();
            drag.velocity = 0;
            e.preventDefault();
        });
        window.addEventListener('mousemove',(e)=>{
            if(!drag.isDown) return;
            const now = performance.now();
            const dt = now - drag.lastTime;
            const dy = e.clientY - drag.lastY;
            if(dt>0) drag.velocity = dy / dt *14;
            drag.lastY = e.clientY;
            drag.lastTime = now;
            const delta = e.clientY - drag.startY;
            setOffsetOnlyTransform(drag.offsetY + delta);
            drag.startY = e.clientY;
        });
        window.addEventListener('mouseup',()=>{
            if(!drag.isDown) return;
            drag.isDown = false;
            isFingerDragging = false;
            startInertia();
        });
        $.gameDragBox.addEventListener('wheel',(e)=>{
            e.preventDefault();
            fullSetOffset(drag.offsetY + e.deltaY *0.5);
        },{passive:false});

        $.gameDragBox.addEventListener('touchstart',(e)=>{
            if(inertiaAnim) cancelAnimationFrame(inertiaAnim);
            drag.isDown = true;
            isFingerDragging = true;
            drag.startY = e.touches[0].clientY;
            drag.lastY = e.touches[0].clientY;
            drag.lastTime = performance.now();
            drag.velocity = 0;
        },{passive:true});

        $.gameDragBox.addEventListener('touchmove',(e)=>{
            if(!drag.isDown) return;
            const now = performance.now();
            const dt = now - drag.lastTime;
            const touchY = e.touches[0].clientY;
            const dy = touchY - drag.lastY;
            if(dt>0) drag.velocity = dy / dt *14;
            drag.lastY = touchY;
            drag.lastTime = now;
            const delta = touchY - drag.startY;
            setOffsetOnlyTransform(drag.offsetY + delta);
            drag.startY = touchY;
        },{passive:true});

        $.gameDragBox.addEventListener('touchend',()=>{
            if(!drag.isDown) return;
            drag.isDown = false;
            isFingerDragging = false;
            startInertia();
        },{passive:true});

        function throttle(fn, delay = 80) {
            let timer = null;
            return function (...args) {
                if (timer) return;
                timer = setTimeout(() => {
                    fn.apply(this, args);
                    timer = null;
                }, delay);
            };
        }

        $.catTrigger.onclick = () => {
            const isShow = $.catPopup.style.display === 'block';
            isShow ? closePopup() : openPopup();
        };

        $.catPopup.onclick = (e) => {
            if (e.target === $.catPopup) closePopup();
        };

        function openPopup() {
            $.catPopup.style.display = 'block';
            $.catTrigger.classList.add('open');
        }

        function closePopup() {
            $.catPopup.style.display = 'none';
            $.catTrigger.classList.remove('open');
        }

        function renderVirtualListByScroll(scrollTop){
            if (virtualListData.length === 0) {
                $.virtualView.innerHTML = `
                    <div class="empty-tip">
                        暂无匹配的游戏<br>
                        <strong>尝试搜索游戏关键词</strong>
                    </div>
                `;
                $.phantom.style.height = '0px';
                return;
            }

            const totalHeight = virtualListData.length * VIRTUAL_ITEM_HEIGHT;
            $.phantom.style.height = totalHeight + 'px';

            const viewHeight = $.gameDragBox.clientHeight;

            let startIndex = Math.floor(scrollTop / VIRTUAL_ITEM_HEIGHT) - VIRTUAL_BUFFER;
            startIndex = Math.max(0, startIndex);

            let endIndex = startIndex + Math.ceil(viewHeight / VIRTUAL_ITEM_HEIGHT) + VIRTUAL_BUFFER * 2;
            endIndex = Math.min(virtualListData.length, endIndex);

            const offsetY = startIndex * VIRTUAL_ITEM_HEIGHT;
            $.virtualView.style.transform = `translateY(${offsetY}px)`;

            let html = '';
            for (let i = startIndex; i < endIndex; i++) {
                const item = virtualListData[i];
                const n = item.name;

                if (currentType === '全部游戏' || isSearchMode) {
                    html += `
                        <div class="game-item">
                            <span class="game-name">${n}</span>
                            <span class="platform-tags">${gamePlatMap[n].join('，')}</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="game-item">
                            <span class="game-name">${n}</span>
                        </div>
                    `;
                }
            }

            $.virtualView.innerHTML = html;
        }

const platformKeys = Object.keys(platformGameJson);

        function renderCategory() {
            let html = '';
            platformKeys.forEach(key => {
                html += `<button class="category-item" data-type="${key}">${key}</button>`;
            });
            $.categoryBox.innerHTML = html;
        }

        renderCategory();

        const gamePlatMap = {};
        let allGameNames = [];

        Object.entries(platformGameJson).forEach(([plat, list]) => {
            if (plat !== "全部游戏") {
                allGameNames = allGameNames.concat(list);
            }
            list.forEach(name => {
                if (!gamePlatMap[name]) gamePlatMap[name] = [];
                if (!gamePlatMap[name].includes(plat)) gamePlatMap[name].push(plat);
            });
        });

        allGameNames = [...new Set(allGameNames)];
        platformGameJson["全部游戏"] = allGameNames;

        function getGroups() {
            const groups = {};
            platformKeys.forEach(k => {
                groups[k] = platformGameJson[k].map(n => ({ name: n }));
            });
            return groups;
        }

        const gameGroups = getGroups();

        let currentType = "全部游戏";
        let filterList = gameGroups[currentType];
        let isSearchMode = false;

        function switchType(type) {
            $.search.value = '';
            isSearchMode = false;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-type="${type}"]`).classList.add('active');
            $.currentCatText.innerText = type;
            $.currentCatText.classList.remove("searching");
            lastSelectCatText = type;
            currentType = type;
            filterList = gameGroups[type];
            virtualListData = [...filterList];
            fullSetOffset(0);
            closePopup();
        }

        $.categoryBox.addEventListener('click', e => {
            const btn = e.target.closest('.category-item');
            if (btn) switchType(btn.dataset.type);
        });

        const searchHandle = throttle(() => {
            const kw = $.search.value.trim().toLowerCase();

            if (!kw) {
                isSearchMode = false;
                $.currentCatText.innerText = lastSelectCatText;
                $.currentCatText.classList.remove("searching");
                switchType(lastSelectCatText);
                return;
            }

            isSearchMode = true;
            $.currentCatText.innerText = "全局搜索中...";
            $.currentCatText.classList.add("searching");
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            virtualListData = gameGroups["全部游戏"].filter(g => g.name.toLowerCase().includes(kw));
            fullSetOffset(0);
        }, 100);

        $.search.addEventListener('focus', function () {
            if(this.value.trim() === ''){
                $.currentCatText.innerText = "全局搜索中...";
                $.currentCatText.classList.add("searching");
            }
        });

        $.search.addEventListener('blur', function () {
            if(this.value.trim() === ''){
                $.currentCatText.innerText = lastSelectCatText;
                $.currentCatText.classList.remove("searching");
            }
        });

        $.search.addEventListener('input', searchHandle);

        virtualListData = [...filterList];
        fullSetOffset(0);
        document.querySelector(`[data-type="${currentType}"]`).classList.add('active');
    </script>
